olute;pointer-events:none;background:#091522f5;border:1px solid var(--line);border-radius:8px;padding:10px 13px;box-shadow:0 5px 25px #0005;font-size:12px;z-index:2;max-width:260px}.graph-tip strong{display:block;color:var(--text);margin-bottom:3px}.graph-tip span{display:block;color:var(--muted)}.graph-footer{display:flex;align-items:center;gap:20px}.graph-footer input[type=range]{flex:1;accent-color:var(--accent);padding:0}.graph-footer output{color:var(--muted);font-size:12px;min-width:180px;text-align:right}.graph-current{color:var(--muted);font-size:12px}.graph-legend{font-size:12px;color:var(--muted);margin-top:12px}.calc-error{color:var(--red)}

<body>
<main>
<header class="hero"><div><h1 class="gpa"><span id="gpa">4.00</span><small>/ 4.00</small></h1><p class="subtle" id="overall-note"></p></div><div class="toolbar"><button class="icon" id="report" title="Report" aria-label="Report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 6.5v7"/><circle cx="12" cy="17" r=".7" fill="currentColor"/></svg></button><button class="icon" id="calculator" title="Calculator" aria-label="Calculator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8v4H8zM8 14h2m4 0h2m-8 4h2m4 0h2"/></svg></button><button class="icon" id="save" title="Save: copy a compact code" aria-label="Save to clipboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 3h13l4 4v14H3V3z"/><path d="M7 3v6h9V3M7 21v-8h10v8M13 4v3"/></svg></button><button class="icon" id="import" title="Import from clipboard" aria-label="Import from clipboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12m-5-5 5 5 5-5M4 14v7h16v-7"/></svg></button></div></header>
<section aria-label="Courses"><div class="section-head"><div></div><button class="primary" data-action="add-course">+ Add course</button></div><div class="course-head"><span></span><span></span><span style="text-align:right">Grade</span><span>Credits</span><span></span></div><div id="courses"></div></section>
<section id="detail" class="detail" aria-label="Selected course details"></section>
<details class="scale"><summary>Grading scale & calculation notes</summary><div id="scale"></div></details>
</main><div id="status" class="status" role="status" aria-live="polite"></div>
<dialog id="code-dialog"><h2 id="dialog-title"></h2><p class="subtle" id="dialog-note"></p><textarea id="code" spellcheck="false" aria-label="Gradebook save code"></textarea><p id="dialog-error" class="error" role="alert"></p><div class="toolbar"><button id="close-dialog">Close</button><button class="primary" id="apply-code">Import gradebook</button></div></dialog>
<dialog id="calculator-dialog" aria-labelledby="calc-title">
<div class="calc-heading"><h2 id="calc-title">Grade calculator</h2><button class="icon quiet" id="close-calculator" aria-label="Close calculator">×</button></div>
<div class="calc-controls"><div><label class="calc-label" for="choose-grade">This Grades…</label><button id="choose-grade" class="select-grade" aria-expanded="false" aria-controls="grade-picker">Choose a grade</button></div><div><label class="calc-label" for="effect-select">Effect on…</label><select id="effect-select" disabled><option value="">Choose a grade first</option></select></div></div>
<div class="second-controls"><div><label class="calc-label" for="choose-second">And this Grades…</label><button id="choose-second" class="select-grade" disabled aria-expanded="false">Choose a grade (optional)</button></div><label class="calc-label">Grade %<input id="second-value" type="number" min="0" max="100" step="any" disabled></label><button id="clear-second" hidden aria-label="Clear second grade">×</button></div><div id="grade-picker" class="grade-picker" hidden></div>
<div id="graph-empty" class="graph-empty">Choose a grade to explore its effect.</div>
<div id="graph-content" hidden><div class="graph-toolbar"><span id="graph-current" class="graph-current"></span><label>X range <select id="x-range"><option value="50">50–100%</option><option value="0">0–100%</option></select></label></div><div class="graph-wrap" id="graph-wrap"><svg id="effect-graph" viewBox="0 0 900 430" role="img" aria-label="Grade relationship graph"></svg><div id="graph-tip" class="graph-tip" hidden></div></div><div class="graph-footer"><input id="graph-slider" type="range" min="50" max="100" step="0.01" value="75" aria-label="Explore grade percentage"><label class="typed-grade">Grade %<input id="grade-value" type="number" min="0" max="100" step="any"></label><output id="graph-readout" aria-live="polite"></output></div><p class="graph-legend" id="graph-legend"></p></div>
</dialog>

<dialog id="report-dialog" aria-labelledby="report-title">
<div class="calc-heading"><h2 id="report-title">Report</h2><button class="icon quiet" id="close-report" aria-label="Close report">×</button></div>
<div class="report-controls"><select id="report-kind" aria-label="Report items"><option value="course">Courses</option><option value="category">Categories</option><option value="grade">Assignments</option></select></div>
<div id="report-list"></div>
</dialog>
<script>
'use strict';
const SCALE=[[93,'A',4],[90,'A−',3.7],[87,'B+',3.3],[83,'B',3],[80,'B−',2.7],[77,'C+',2.3],[73,'C',2],[70,'C−',1.7],[63,'D',1],[0,'F',0]];
const grade=(n=1)=>({name:`Grade ${n}`,score:100,weight:null});
const category=(n=1)=>({name:`Category ${n}`,weight:100,open:true,grades:[grade()]});
const course=(n=1)=>({name:`Course ${n}`,credits:3,scale:SCALE.map(r=>r[0]),categories:[category()]});
let state={selected:0,courses:[course()]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n.toLocaleString(undefined,{maximumFractionDigits:2});
const numeric=(n,max=100)=>typeof n==='number'&&Number.isFinite(n)&&n>=0&&n<=max;
const close=(a,b)=>Math.abs(a-b)<1e-7;
function categoryResult(cat){
 const explicit=cat.grades.reduce((s,g)=>s+(g.weight>0?g.weight:0),0),auto=cat.grades.filter(g=>g.weight===null).length;
 let error='';
 if(!cat.grades.length)error='Add at least one grade.';
 else if(cat.grades.some(g=>!numeric(g.score)||(g.weight!==null&&!numeric(g.weight))))error='Enter grades and weights between 0 and 100.';
 else if(explicit>100+1e-7)error='Assignment weights exceed 100%.';
 else if(!auto&&!close(explicit,100))error='Explicit assignment weights must total 100%.';
 const weights=cat.grades.map(g=>g.weight!==null?g.weight:(auto?Math.max(0,100-explicit)/auto:0));
 return {error,weights,value:error?null:cat.grades.reduce((s,g,i)=>s+g.score*weights[i]/100,0)};
}
function courseResult(c){
 const total=c.categories.reduce((s,x)=>s+(Number.isFinite(x.weight)?x.weight:0),0);
 const badWeights=!c.categories.length||c.categories.some(x=>!numeric(x.weight))||!close(total,100);
 const results=c.categories.map(categoryResult);
 const badScale=!validScale(c.scale);
 const error=badScale?'Grade cutoffs must descend from A to F without overlapping.':badWeights?'Category weights must total 100%.':results.some((r,i)=>c.categories[i].weight>0&&r.error)?'Check assignment grades and weights.':!numeric(c.credits,1000)?'Enter credit hours from 0 to 1,000.':'';
 const value=error?null:results.reduce((s,r,i)=>s+(c.categories[i].weight>0?r.value*c.categories[i].weight/100:0),0);
 return {total,badWeights,results,error,value,letter:value===null?'—':SCALE.find((r,i)=>value+1e-9>=c.scale[i])[1],points:value===null?null:SCALE.find((r,i)=>value+1e-9>=c.scale[i])[2]};
}
function reorderButtons(kind,c,k,g){return `<button class="drag-handle" data-drag="${kind}" data-c="${c}" data-k="${k}" data-g="${g}" aria-label="Reorder ${kind}" title="Drag to reorder; or use arrow keys"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>`;}
function validScale(scale){return Array.isArray(scale)&&scale.length===SCALE.length&&scale.every((v,i)=>numeric(v)&&(i===0||v<scale[i-1]))&&scale[scale.length-1]===0;}
function renderScale(){const c=state.courses[state.selected];$('#scale').innerHTML=c?`<p id="scale-course">${esc(c.name)}</p><div class="scale-header"><span>Grade</span><span>Percentage range</span><span>GPA points</span></div>${SCALE.map((r,i)=>`<div class="scale-row"><strong>${r[1]}</strong><div class="range"><input type="number" min="0" max="100" step="any" data-cutoff="${i}" value="${c.scale[i]??''}" aria-label="${r[1]} minimum percentage" ${i===SCALE.length-1?'readonly':''}><span>${i?'– <':'–'}</span><input type="number" min="0" max="100" step="any" ${i?`data-cutoff="${i-1}"`:''} value="${i?(c.scale[i-1]??''):100}" aria-label="${r[1]} upper percentage boundary" ${i?'':'readonly'}><span>%</span></div><span>${r[2].toFixed(1)}</span></div>`).join('')}<p id="scale-error" class="error" role="status"></p>`:'';}
function field(kind,key,value,c,k=-1,g=-1,type='text',label='',extra=''){return `<input class="${key==='name'?'name':''}" type="${type}" data-kind="${kind}" data-key="${key}" data-c="${c}" data-k="${k}" data-g="${g}" aria-label="${esc(label||key)}" value="${esc(value??'')}" ${type==='number'?`min="0" max="${key==='credits'?1000:100}" step="any"`: 'maxlength="500"'} ${extra}>`;}
function removeButton(kind,c,k=-1,g=-1){return `<button class="icon quiet delete" data-action="remove-${kind}" data-c="${c}" data-k="${k}" data-g="${g}" aria-label="Remove ${kind}" title="Remove ${kind}">×</button>`;}
function infoButton(kind,c,k=-1,g=-1){return `<button class="info" data-info="${kind}" data-c="${c}" data-k="${k}" data-g="${g}" aria-label="Explore ${kind} grade" title="Explore this grade">ⓘ</button>`;}
function gradeBand(c,value){return typeof value==='number'&&Number.isFinite(value)&&value>=-1e-7&&value<=100+1e-7&&validScale(c.scale)?SCALE.find((r,i)=>value+1e-9>=c.scale[i]):null;}
function pointColor(points){return points===null?'var(--muted)':points>=4?'#168651':points>=3.7?'#a9d9ac':points>=3?'#e4cf72':points>=2.7?'#e5a064':points>=2?'#efa29c':'#bd484f';}
function paintGrade(el,c,value){if(el)el.style.color=pointColor(gradeBand(c,value)?.[2]??null);}
function totalGPA(courses=state.courses,overrideIndex=-1,overridePoints=null){let credits=0,sum=0;for(let i=0;i<courses.length;i++){const c=courses[i];if(!numeric(c.credits,1000))return null;if(!c.credits)continue;const points=i===overrideIndex?overridePoints:courseResult(c).points;if(points===null)return null;credits+=c.credits;sum+=c.credits*points;}return credits?sum/credits:null;}
function fitNames(){document.querySelectorAll('input.name').forEach(el=>el.style.width=`${Math.max(5,el.value.length+2)}ch`);}
function render(){
 $('#courses').innerHTML=state.courses.length?state.courses.map((c,i)=>`<div class="course-row ${i===state.selected?'selected':''}" data-select="${i}" tabindex="0" aria-label="Select ${esc(c.name)}" ${i===state.selected?'aria-current="true"':''}>${reorderButtons('course',i,-1,-1)}<div class="name-cell">${field('course','name',c.name,i,-1,-1,'text','Course name')}</div><span class="letter" data-letter="${i}"></span>${field('course','credits',c.credits,i,-1,-1,'number','Credit hours')}<div class="row-actions">${infoButton('course',i)}${removeButton('course',i)}</div></div>`).join(''):'<div class="empty">Add a course to begin.</div>';
 const c=state.courses[state.selected],ci=state.selected;
 $('#detail').innerHTML=c?`<div class="detail-head aligned"><div class="detail-name"><div class="eyebrow">Course details</div><h2 class="detail-title" id="detail-name">${esc(c.name)}</h2></div><div class="course-score" id="course-score"></div><div></div><div class="row-actions">${infoButton('course',ci)}</div></div><div class="chart" id="chart" aria-label="Course grade"></div><div class="chart-label subtle"><span id="detail-note"></span><span id="weight-total"></span></div><div class="category-toggle-all"><button id="toggle-all-categories" data-action="toggle-categories" data-c="${ci}" aria-controls="category-list" aria-label="Collapse all categories" aria-expanded="true" ${c.categories.length?'':'disabled'}><span aria-hidden="true">›</span></button></div><div id="category-list">${c.categories.map((cat,k)=>`<div class="category" data-cat="${k}"><div class="category-top aligned"><div class="category-name"><details class="category-toggle" data-toggle="${k}" ${cat.open?'open':''}><summary aria-label="Expand or collapse ${esc(cat.name)}"></summary></details>${reorderButtons('category',ci,k,-1)}<div class="name-cell">${field('category','name',cat.name,ci,k,-1,'text','Category name')}</div></div><div><span class="field-label">Grade / 100</span><output class="calculated" data-cat-score="${k}"></output></div><label><span class="field-label">Weight %</span>${field('category','weight',cat.weight,ci,k,-1,'number','Category weight')}</label><div class="row-actions">${infoButton('category',ci,k)}${removeButton('category',ci,k)}</div></div><div class="category-body" data-body="${k}" ${cat.open?'':'hidden'}><div class="grade-head aligned"><span>Assignment</span><span>Grade / 100</span><span>Weight %</span><span></span></div>${cat.grades.map((g,j)=>`<div class="grade-row aligned" data-grade="${j}"><div class="assignment-name">${reorderButtons('grade',ci,k,j)}<div class="name-cell">${field('grade','name',g.name,ci,k,j,'text','Assignment name')}</div></div>${field('grade','score',g.score,ci,k,j,'number','Assignment grade')}${field('grade','weight',g.weight,ci,k,j,'number','Assignment weight','placeholder="Auto"')}<div class="row-actions">${infoButton('grade',ci,k,j)}${removeButton('grade',ci,k,j)}</div></div>`).join('')}<div class="category-footer"><span class="error" data-cat-error="${k}" role="status"></span><button data-action="add-grade" data-c="${ci}" data-k="${k}">+ Grade</button></div></div></div>`).join('')}</div><div class="category-tools"><button data-action="add-category" data-c="${ci}">+ Category</button></div>`:'<div class="empty">Select or add a course to see its details.</div>';
 renderScale();fitNames();refresh();syncCategoryToggle();
}
function refresh(){
 const results=state.courses.map(courseResult),credits=state.courses.reduce((s,c)=>s+(Number.isFinite(c.credits)?c.credits:0),0),gpa=totalGPA();
 $('#gpa').textContent=gpa===null?'—':gpa.toFixed(2);$('#gpa').style.color=gpa===null?'':pointColor(gpa);$('#overall-note').textContent=`${fmt(credits)} credit hours`;
 results.forEach((r,i)=>{const el=$(`[data-letter="${i}"]`);el.textContent=r.letter;paintGrade(el,state.courses[i],r.value);el.title=r.error||`${fmt(r.value)}% · ${r.points.toFixed(1)} grade points`;});
 const c=state.courses[state.selected],r=results[state.selected];if(!c)return;
 $('#scale-course').textContent=c.name||'Untitled course';$('#scale-error').textContent=validScale(c.scale)?'':'Enter descending cutoffs between 0 and 100.';$('#detail-name').textContent=c.name||'Untitled course';$('#course-score').textContent=r.value===null?'—':`${fmt(r.value)}%`;paintGrade($('#course-score'),c,r.value);
 $('#detail-note').textContent=r.error||`${r.letter} · ${r.points.toFixed(1)} grade points`;$('#detail-note').classList.toggle('invalid',!!r.error);$('#weight-total').textContent=`${fmt(r.total)} / 100% allocated`;
 $('#weight-total').classList.toggle('invalid',r.badWeights);$('#category-list').classList.toggle('invalid-category-weights',r.badWeights);$('#chart').style.background=pointColor(r.points);
 r.results.forEach((x,k)=>{const score=$(`[data-cat-score="${k}"]`);score.textContent=x.value===null?'—':fmt(x.value);paintGrade(score,c,x.value);$(`[data-cat="${k}"]`).classList.toggle('invalid-grades',!!x.error);$(`[data-cat-error="${k}"]`).textContent=x.error;c.categories[k].grades.forEach((g,j)=>{const weight=$(`input[data-kind="grade"][data-key="weight"][data-k="${k}"][data-g="${j}"]`);weight.placeholder=x.error?'Auto':`${fmt(x.weights[j])}%`;weight.title=g.weight===null?'Automatic weight':'Explicit weight';paintGrade($(`input[data-kind="grade"][data-key="score"][data-k="${k}"][data-g="${j}"]`),c,g.score);});});
}
function syncCategoryToggle(){const c=state.courses[state.selected],button=$('#toggle-all-categories');if(!c||!button)return;const anyOpen=c.categories.some(cat=>cat.open);button.setAttribute('aria-expanded',String(anyOpen));button.setAttribute('aria-label',anyOpen?'Collapse all categories':'Expand all categories');button.title=anyOpen?'Collapse all categories':'Expand all categories';button.disabled=!c.categories.length;}
function toggleAllCategories(){const c=state.courses[state.selected];if(!c)return;const open=!c.categories.some(cat=>cat.open);c.categories.forEach(cat=>cat.open=open);document.querySelectorAll('.category-toggle').forEach(el=>{el.open=open;});document.querySelectorAll('[data-body]').forEach(el=>{el.hidden=!open;});syncCategoryToggle();}
function nextName(items,prefix){let n=1;while(items.some(x=>x.name===`${prefix} ${n}`))n++;return n;}
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.cutoff!==undefined){const c=state.courses[state.selected];c.scale[+d.cutoff]=e.target.value===''?null:Number(e.target.value);document.querySelectorAll(`[data-cutoff="${d.cutoff}"]`).forEach(input=>{if(input!==e.target)input.value=e.target.value;});refresh();return;}if(!d.kind)return;const c=state.courses[+d.c],target=d.kind==='course'?c:d.kind==='category'?c.categories[+d.k]:c.categories[+d.k].grades[+d.g];target[d.key]=e.target.type==='number'?(e.target.value===''?(d.key==='weight'&&d.kind!=='grade'?0:null):Number(e.target.value)):e.target.value;if(d.key==='name')fitNames();refresh();});
document.addEventListener('toggle',e=>{if(e.target.matches('.category-toggle')){const k=+e.target.dataset.toggle;state.courses[state.selected].categories[k].open=e.target.open;$(`[data-body="${k}"]`).hidden=!e.target.open;syncCategoryToggle();}},true);
document.addEventListener('click',e=>{if(suppressDragClick){suppressDragClick=false;return;}const info=e.target.closest('[data-info]');if(info){const d=info.dataset;openCalculator({kind:d.info,c:+d.c,k:+d.k,g:+d.g});return;}const b=e.target.closest('[data-action]');if(b){const d=b.dataset,c=state.courses[+d.c],k=+d.k,g=+d.g;
 switch(d.action){case 'toggle-categories':toggleAllCategories();return;case 'add-course':state.courses.push(course(nextName(state.courses,'Course')));state.selected=state.courses.length-1;break;case 'add-category':{const cat=category(nextName(c.categories,'Category'));cat.weight=c.categories.length?0:100;c.categories.push(cat);break;}case 'add-grade':c.categories[k].grades.push(grade(nextName(c.categories[k].grades,'Grade')));break;case 'remove-course':state.courses.splice(+d.c,1);if(+d.c<state.selected)state.selected--;state.selected=Math.min(state.selected,state.courses.length-1);break;case 'remove-category':c.categories.splice(k,1);break;case 'remove-grade':c.categories[k].grades.splice(g,1);break;}
 render();return;}
 const catTop=e.target.closest('.category-top');if(catTop&&!e.target.closest('input,button,summary,details')){const toggle=catTop.querySelector('.category-toggle');toggle.open=!toggle.open;return;}
 const row=e.target.closest('[data-select]');if(row&& !e.target.closest('input,button')&&state.selected!==+row.dataset.select){state.selected=+row.dataset.select;render();}
});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-select]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();state.selected=+e.target.dataset.select;render();$(`[data-select="${state.selected}"]`).focus();}});
// Reordering is scoped to the current list. Commit only on drop; Escape cancels.
let dragging=null,suppressDragClick=false;
function dragList(d){return d.kind==='course'?state.courses:d.kind==='category'?state.courses[d.c].categories:state.courses[d.c].categories[d.k].grades;}
function moveItem(d,to){const list=dragList(d),selected=state.courses[state.selected];if(to<0||to>=list.length)return;list.splice(to,0,list.splice(d.index,1)[0]);state.selected=state.courses.indexOf(selected);}
document.addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-drag]');if(!handle||e.button!==0)return;const d=handle.dataset,kind=d.drag,index=+(kind==='course'?d.c:kind==='category'?d.k:d.g),selector=kind==='course'?'[data-select]':kind==='category'?'[data-cat]':'[data-grade]',row=handle.closest(selector);dragging={kind,c:+d.c,k:+d.k,index,selector,row,parent:row.parentElement,x:e.clientX,y:e.clientY,active:false,pointerId:e.pointerId};e.preventDefault();handle.focus();});
document.addEventListener('pointermove',e=>{const d=dragging;if(!d||e.pointerId!==d.pointerId)return;if(!d.active&&Math.hypot(e.clientX-d.x,e.clientY-d.y)<4)return;d.active=true;d.row.classList.add('dragging');document.body.classList.add('is-dragging');e.preventDefault();const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(d.selector);if(target&&target!==d.row&&target.parentElement===d.parent){const rect=target.getBoundingClientRect();d.parent.insertBefore(d.row,e.clientY<rect.top+rect.height/2?target:target.nextSibling);}if(e.clientY<60)window.scrollBy(0,-16);else if(e.clientY>window.innerHeight-60)window.scrollBy(0,16);},{passive:false});
function finishDrag(commit){const d=dragging;if(!d)return;dragging=null;document.body.classList.remove('is-dragging');if(d.active){if(commit){const rows=Array.from(d.parent.children).filter(el=>el.matches(d.selector));moveItem(d,rows.indexOf(d.row));}suppressDragClick=true;setTimeout(()=>suppressDragClick=false,0);render();}}
document.addEventListener('pointerup',()=>finishDrag(true));document.addEventListener('pointercancel',()=>finishDrag(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dragging){finishDrag(false);return;}const h=e.target.closest('[data-drag]');if(!h||!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const a=h.dataset,d={kind:a.drag,c:+a.c,k:+a.k,index:+(a.drag==='course'?a.c:a.drag==='category'?a.k:a.g)},to=d.index+(e.key==='ArrowUp'?-1:1);if(to<0||to>=dragList(d).length)return;moveItem(d,to);render();const sel=d.kind==='course'?`[data-drag="course"][data-c="${to}"]`:d.kind==='category'?`[data-drag="category"][data-k="${to}"]`:`[data-drag="grade"][data-k="${d.k}"][data-g="${to}"]`;$(sel)?.focus();});
// Version 3 distinguishes automatic weights (null) from explicit zero. Older codes retain their original behavior.
function pack(){return [3,state.selected,state.courses.map(c=>[c.name,c.credits,c.scale,c.categories.map(k=>[k.name,k.weight,k.open?1:0,k.grades.map(g=>[g.name,g.score,g.weight])])])];}
function unpack(p){
 const fail=()=>{throw Error('This is not a valid Gradebook code. Your current work is unchanged.');};
 const arr=(a,n)=>Array.isArray(a)&&a.length===n;const name=s=>typeof s==='string'&&s.length<=500;const num=n=>n===null||(typeof n==='number'&&Number.isFinite(n));const bit=n=>n===0||n===1;
 if(!arr(p,3)||![1,2,3].includes(p[0])||!Number.isInteger(p[1])||!Array.isArray(p[2])||p[2].length>500||p[1]<(p[2].length?0:-1)||p[1]>=p[2].length)fail();
 let count=0;
 const courses=p[2].map(c=>{if(!arr(c,4)||!name(c[0])||!num(c[1])||!(p[0]===1?bit(c[2]):arr(c[2],SCALE.length)&&c[2].every(num))||!Array.isArray(c[3])||c[3].length>500)fail();return {name:c[0],credits:c[1],scale:p[0]===1?SCALE.map(r=>r[0]):c[2],categories:c[3].map(k=>{if(!arr(k,4)||!name(k[0])||!num(k[1])||!bit(k[2])||!Array.isArray(k[3])||k[3].length>5000)fail();return {name:k[0],weight:k[1],open:!!k[2],grades:k[3].map(g=>{if(++count>50000||!arr(g,3)||!name(g[0])||!num(g[1])||!num(g[2]))fail();return {name:g[0],score:g[1],weight:p[0]<3&&g[2]===0?null:g[2]};})};})};});return {selected:p[1],courses};
}
function base64(bytes){let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function encode(){const bytes=new TextEncoder().encode(JSON.stringify(pack()));let zipped=null;if(typeof CompressionStream!=='undefined'){try{zipped=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer());}catch{}}
 return zipped&&zipped.length<bytes.length?'GB1z.'+base64(zipped):'GB1j.'+base64(bytes);
}
async function decode(code){code=code.trim();if(code.length>2000000||!/^GB1[zj]\.[A-Za-z0-9_-]+$/.test(code))throw Error('Invalid code. Paste the complete code beginning with GB1.');let raw;try{raw=Uint8Array.from(atob(code.slice(5).replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));}catch{throw Error('The save code is incomplete or damaged.');}
 if(code[3]==='z'){if(typeof DecompressionStream==='undefined')throw Error('Please open this file in an up-to-date browser to import compressed codes.');try{const reader=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate')).getReader();let chunks=[],size=0;for(;;){const {value,done}=await reader.read();if(done)break;size+=value.length;if(size>5000000){await reader.cancel();throw Error();}chunks.push(value);}raw=new Uint8Array(size);let offset=0;for(const chunk of chunks){raw.set(chunk,offset);offset+=chunk.length;}}catch{throw Error('The compressed save code is damaged or too large.');}}
 try{return unpack(JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(raw)));}catch{throw Error('This is not a valid Gradebook code. Your current work is unchanged.');}
}
let toastTimer;function toast(s){$('#status').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#status').textContent='',5000);}
function showDialog(mode,code=''){$('#dialog-title').textContent=mode==='save'?'Your save code':'Import gradebook';$('#dialog-note').textContent=mode==='save'?'Clipboard access is unavailable. Copy this code and keep it somewhere safe.':'Paste your save code below. A valid import replaces the entire current gradebook.';$('#code').value=code;$('#code').readOnly=mode==='save';$('#apply-code').hidden=mode==='save';$('#dialog-error').textContent='';$('#code-dialog').showModal();$('#code').focus();if(mode==='save')$('#code').select();}
function clipboardTimeout(promise){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Clipboard unavailable')),1500);Promise.resolve(promise).then(v=>{clearTimeout(timer);resolve(v);},e=>{clearTimeout(timer);reject(e);});});}
$('#save').onclick=async()=>{try{const code=await encode();try{await clipboardTimeout(navigator.clipboard.writeText(code));toast(`Saved to clipboard · ${code.length} characters`);}catch{showDialog('save',code);}}catch{toast('Could not create a save code. Please try again.');}};
$('#import').onclick=async()=>{let code;try{code=await clipboardTimeout(navigator.clipboard.readText());}catch{showDialog('import');return;}try{const next=await decode(code);state=next;render();toast('Gradebook imported.');}catch(e){showDialog('import',code);$('#dialog-error').textContent=e.message;}};
$('#apply-code').onclick=async()=>{const b=$('#apply-code');b.disabled=true;try{const next=await decode($('#code').value);state=next;render();$('#code-dialog').close();toast('Gradebook imported.');}catch(e){$('#dialog-error').textContent=e.message;}finally{b.disabled=false;}};
$('#close-dialog').onclick=()=>$('#code-dialog').close();

let calcRef=null,calcModel=null,calcGraph=null;

// Report influence is the GPA span achievable while holding every other grade fixed.
function reportItem(ref){
 const current=refValue(ref),model=buildModel(ref),baseline=totalGPA();
 const item={ref,current,influence:null,up:null,down:null};

 if(low===null||high===null)return item;

  for(const threshold of model.thresholds){
   // Downward changes must pass below a cutoff; reaching it retains the higher letter.
   const distance=direction===1?threshold.x-current:current-threshold.x+0.000001;
   if(distance<0)continue;
   const delta=Math.max(0.01,Math.ceil(distance*100-1e-8)/100),target=current+direction*delta;

   if(total===null||direction*(total-baseline)<1e-10)continue;
   const key=direction===1?'up':'down';
   if(!item[key]||delta<item[key].delta)item[key]={delta,target,total};
  }
 }

}

$('#clear-second').onclick=()=>{calcRef2=null;$('#choose-second').textContent='Choose a grade (optional)';$('#second-value').disabled=true;$('#clear-second').hidden=true;drawGraph();};
$('#effect-graph').addEventListener('click',e=>{const label=e.target.closest('[data-second]');if(label){$('#second-value').value=label.dataset.second;drawGraph();}});
$('#second-value').oninput=()=>{if($('#second-value').value!==''&&numeric(Number($('#second-value').value)))drawGraph();};
$('#grade-value').oninput=e=>{if(!calcGraph||e.target.value===''||!numeric(Number(e.target.value)))return;const x=Number(e.target.value);if(x<calcGraph.xMin){$('#x-range').value='0';drawGraph();}$('#graph-slider').value=x;showGraphValue(x,false);};

render();
</script>
</body>
</html>
