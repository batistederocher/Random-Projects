<style>

*{box-sizing:border-box}input[type=checkbox]{accent-color:var(--acc)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:14px 16px 28px}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px}
h1{font:700 34px/1.15 Georgia,"Times New Roman",serif;margin:4px 0 20px;overflow-wrap:anywhere}
input[type=text]{width:100%;font-size:20px;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--acc)}
.acc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.acc button{flex:1 0 11%;min-width:36px;height:42px;font-size:19px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{font:inherit;cursor:pointer}
.main{width:100%;height:50px;font-size:18px;font-weight:600;border:0;border-radius:12px;background:var(--acc);color:var(--accInk)}
.row{display:flex;gap:8px;margin-top:8px}
.row button,.restart{flex:1;height:46px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:16px}
.restart{width:100%;margin-top:16px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hint{font:600 22px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;margin:0 0 12px;min-height:0;overflow-wrap:anywhere}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:17px;display:none}
.fb.ok{display:block;background:var(--okbg);color:var(--ok)}
.fb.no{display:block;background:var(--nobg);color:var(--no)}
.fb.mid{display:block;background:var(--midbg);color:var(--mid)}
.fb b{font:700 22px Georgia,serif;display:block;margin-top:2px}
label.t{display:flex;gap:8px;align-items:center;margin-top:16px;color:var(--mute);font-size:15px}
label.t input{width:20px;height:20px}
ul{padding-left:20px;line-height:1.7}
.end h1{margin-bottom:8px}
[hidden]{display:none!important}
/* multiple choice */
.opts{display:grid;gap:8px}
.opts button{min-height:46px;padding:8px 12px;text-align:left;font-size:18px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);overflow-wrap:anywhere}
.opts button:disabled{cursor:default}
.opts button.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.opts button.no{background:var(--nobg);color:var(--no);border-color:var(--no)}
/* side menu */
.dock{position:fixed;top:0;bottom:0;right:0;width:min(320px,86vw);transform:translateX(100%);transition:transform .25s}
.dock.open{transform:none}
.tab{position:absolute;left:-44px;top:42%;width:44px;height:64px;border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.panel{height:100%;display:flex;flex-direction:column;overflow-y:auto;background:var(--card);border-left:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));visibility:hidden;transition:visibility 0s .25s;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
.dock.open .panel{visibility:visible;transition-delay:0s}
.grp{margin-bottom:14px}
.grp>span{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;height:40px;border:0;background:transparent;color:var(--ink);font-size:15px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-checked=true]{background:var(--acc);color:var(--accInk);font-weight:600}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:13px;color:var(--mute);margin:6px 0 0}
.sets label{display:flex;gap:8px;align-items:center;font-size:15px;padding:4px 0}.sets input{width:20px;height:20px}#rev{color:var(--acc);margin-left:8px}.restart+.restart{margin-top:8px}.alt{width:100%;height:46px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:16px}
.vh{font-size:14px;font-weight:600;margin:4px 0 6px}
.vocab{flex:1;min-height:140px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin:0;padding:6px 12px;list-style:none;line-height:1.5}
.vocab li{padding:5px 0;border-bottom:1px solid var(--line);font-size:16px}
.vocab li:last-child{border:0}
@media(prefers-reduced-motion:reduce){.dock,.bar i{transition:none}}

/* Minimal chrome and classic system fonts. */
html,body{font-family:Tahoma,Verdana,'Trebuchet MS',sans-serif}
main{padding-top:44px}
.card{padding-top:25px}
h1,.fb b{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:400;letter-spacing:0;line-height:1.3}
input[type=text],.hint,.top,.vh{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:0}
button,input{font-family:inherit}
.acc button,.main,.row button,.restart,.alt,.opts button,.seg button,.sets label,.vocab-word{font-family:Tahoma,Verdana,sans-serif}
.grp>span,.set-folder summary small,.sets label small{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:0;text-transform:none}
.tab{width:38px;left:-38px;height:160px;top:34%;padding:0;gap:0;border-radius:10px 0 0 10px}
.tab svg{width:21px;height:34px}
.dock{width:min(360px,calc(100vw - 48px))}
@media(max-width:600px){main{padding-top:28px;margin-right:22px;padding-right:18px}.card{padding-top:22px}.tab{top:30%;height:150px}h1{font-size:27px}}

input[type=text]{font-family:Tahoma,Verdana,sans-serif}

<body>
<main>
  <div class="top"><span><span id="prog"></span><b id="rev" hidden>Review</b></span><span id="sc"></span></div>
  <div class="bar"><i id="fill"></i></div>

  <section class="card" id="quiz">
    <h1 id="en"></h1>
    <p class="hint" id="hint" hidden></p>
    <input type="text" id="in" placeholder="French spelling" lang="fr" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="French spelling">
    <div class="acc" id="accs"></div>
    <div class="opts" id="opts" hidden></div>
    <button class="alt" id="pb" hidden>Check</button>
    <button class="main" id="go">Check</button>
    <div class="row" id="row2"><button id="hb">Hint</button><button id="sb">Show answer</button></div>
    <div class="fb" id="fb" role="status" aria-live="polite"></div>
    <label class="t" id="artl"><input type="checkbox" id="art" checked> Include the article (un, une, le, la, l’, les, des)</label>
  </section>

  <section class="card end" id="end" hidden>
    <h1 id="endt"></h1>
    <div id="endm"></div>
    <div class="row"><button id="again">Start over</button><button id="redo">Practice missed</button></div>
  </section>

  <button class="restart" id="restart">Restart</button>
  <button class="restart" id="endb">End</button>
</main>

<div class="dock" id="dock">
  <button class="tab" id="mb" aria-expanded="false" aria-controls="panel" aria-label="Open menu"><svg id="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M12 4v16M17 4v16"/></svg></button>
  <aside class="panel" id="panel" aria-label="Settings and vocabulary">
    <div class="grp"><span id="l1">Card Order</span>
      <div class="seg" role="radiogroup" aria-labelledby="l1">
        <button role="radio" data-k="order" data-v="random">Random</button><button role="radio" data-k="order" data-v="ordered">Ordered</button>
      </div></div>
    <div class="grp"><span id="l2">Answer Language</span>
      <div class="seg" role="radiogroup" aria-labelledby="l2">
        <button role="radio" data-k="lang" data-v="en">English</button><button role="radio" data-k="lang" data-v="fr">French</button>
      </div></div>
    <div class="grp"><span id="l3">Mode</span>
      <div class="seg" role="radiogroup" aria-labelledby="l3">
        <button role="radio" data-k="mode" data-v="typing">Typing</button><button role="radio" data-k="mode" data-v="mc">Multiple Choice</button>
      </div>
      <p class="note" id="lock" hidden>Locked to Multiple Choice while answering in English.</p></div>
    <div class="grp"><span id="l4">Vocab Sets</span><div class="sets" id="sets"></div></div>
    <p class="vh" id="vh"></p>
    <ul class="vocab" id="vocab" aria-labelledby="vh"></ul>
  </aside>
</div>

    b.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();hide()}});
    b.addEventListener('contextmenu',e=>e.preventDefault());li.append(b);u.append(li);
  });
}
function hideTranslations(){document.querySelectorAll('.vocab-word').forEach(b=>{b.classList.remove('held');b.setAttribute('aria-expanded','false');b.querySelector('.translation').hidden=true})}
window.addEventListener('blur',hideTranslations);
document.addEventListener('visibilitychange',()=>{if(document.hidden)hideTranslations()});
const mode=()=>S.lang==='en'?'mc':S.mode;

/* ---------- helpers ---------- */
function answer(w){return w[2]||w[1][0]}
const frShow=w=>useArt()?answer(w):stripArt(answer(w));
const prompt_=w=>S.lang==='fr'?w[0]:answer(w);
const same=w=>W.filter(x=>x[1].some(a=>w[1].includes(a)));
const fmt=x=>S.lang==='fr'?frShow(x):x[0];
const ansText=w=>S.lang==='fr'?frShow(w):same(w).map(x=>x[0]).join(' / ');

/* hand-written misspellings (accents unchanged, article untouched) */
const M={
"un époux":["un épous","un épeux"],
"une épouse":["une épouze","une épousse"],
"aîné(e)":["aîmé(e)","aînné(e)"],
"cadet(te)":["caddet(te)","cadet(ette)"],
"un beau-frère":["un beau-frèrre","un baeu-frère"],
"un beau-père":["un beau-pèrre","un baeu-père"],
"une belle-mère":["une bele-mère","une belle-mèrre"],
"une belle-sœur":["une belle-sœure","une bellle-sœur"],
"un(e) cousin(e)":["un(e) cousain(e)","un(e) couzin(e)"],
"un demi-frère":["un demi-frèrre","un demie-frère"],
"une demi-sœur":["une demie-sœur","une demi-sœure"],
"les enfants":["les enfents","les anfants"],
"un mari / un époux":["un marri / un époux","un mari / un épous"],
"une épouse / une femme":["une épouze / une femme","une épouse / une famme"],
"une femme":["une famme","une femne"],
"une famille":["une famile","une familie"],
"une fille":["une file","une fillle"],
"un fils":["un fil","un fisl"],
"un frère":["un frèrre","un frèr"],
"une grand-mère":["une grande-mère","une grand-mèrre"],
"un grand-père":["un grand-pèrre","un grant-père"],
"les grands-parents":["les grand-parents","les grands-parrents"],
"une mère":["une mèrre","une mèr"],
"un neveu":["un neveux","un nevue"],
"une nièce":["une nièse","une niècce"],
"un oncle":["un onkle","un oncel"],
"les parents":["les parrents","les parants"],
"un père":["un pèrre","un pèr"],
"une petite-fille":["une petite-file","une petitte-fille"],
"un petit-fils":["un petit-fil","un pettit-fils"],
"les petits-enfants":["les petit-enfants","les petits-enfents"],
"une sœur":["une sœure","une sœr"],
"une tante":["une tente","une tantte"],
"un chat":["un chas","un chatt"],
"un chien":["un chein","un chienn"],
"un oiseau":["un oiseaux","un oisau"],
"un poisson":["un poison","un poissson"],
"divorcer":["divorser","devorcer"],
"épouser":["épouzer","épousser"],
"célibataire":["célibatair","célibattaire"],
"divorcé(e)":["divorsé(e)","devorcé(e)"],
"fiancé(e)":["fiansé(e)","fianncé(e)"],
"marié(e)":["marrié(e)","maryé(e)"],
"séparé(e)":["séparré(e)","sépparé(e)"],
"veuf / veuve":["veuff / veuve","veuf / veuv"],
"un(e) voisin(e)":["un(e) voizin(e)","un(e) voisain(e)"]
};
function makeOptions(w){
  const sm=same(w),correct=fmt(w),P=deck().length>=(S.lang==='en'?14:6)?deck():W;
  if(S.lang==='en'){
    const out=[correct];
    for(const x of shuffle(P)){if(out.length>=12)break;if(!sm.includes(x)&&!out.includes(x[0]))out.push(x[0])}
    return {list:shuffle(out),good:sm.map(fmt)};
  }
  const ws=[w];
  for(const x of shuffle(P)){if(ws.length>=4)break;if(!ws.some(y=>same(y).includes(x)))ws.push(x)}
  const out=[];
  ws.forEach(x=>{const k=answer(x);[k,...(M[k]||M2[k]||[])].forEach(s=>out.push(useArt()?s:stripArt(s)))});
  return {list:shuffle(out),good:[correct]};
}

/* ---------- quiz flow ---------- */
function start(list,isReview){
  if(!isReview){review=false;first=null;rounds=0}
  q=S.order==='random'?shuffle(list):list.slice().sort((a,b)=>W.indexOf(a)-W.indexOf(b));
  i=0;score=0;missed=[];answered=0;
  if(!q.length){$('quiz').hidden=true;$('end').hidden=false;$('fill').style.width='0';$('prog').textContent='';$('rev').hidden=true;$('sc').textContent='';$('endt').textContent='No vocabulary selected';$('endm').innerHTML='<p>Check at least one set in the menu.</p>';$('redo').hidden=true;return}
  $('quiz').hidden=false;$('end').hidden=true;show();
}
function layout(){
  const mc=mode()==='mc',ask=phase==='ask';
  $('in').hidden=mc;$('accs').hidden=mc;
  $('opts').hidden=!mc;
  $('go').hidden=mc&&ask;
  $('row2').hidden=mc||!ask;$('pb').hidden=mc||ask;
  $('artl').hidden=S.lang==='en';
}
function show(){
  const w=q[i];phase='ask';tries=0;hn=0;failed=false;att=0;
  $('en').textContent=prompt_(w);$('en').lang=S.lang==='fr'?'en':'fr';
  const inp=$('in');inp.value='';inp.disabled=false;
  $('hint').hidden=true;$('fb').className='fb';$('fb').innerHTML='';
  $('go').textContent='Check';
  $('prog').textContent=(i+1)+' of '+q.length;$('rev').hidden=!review;
  $('sc').textContent='Correct: '+score;
  $('fill').style.width=(i/q.length*100)+'%';
  const o=$('opts');o.innerHTML='';
  if(mode()==='mc'){
    const m=makeOptions(w);opts=m;
    m.list.forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s;if(S.lang==='en')b.lang='en';else b.lang='fr';b.onclick=()=>pick(s);o.appendChild(b)});
  }
  layout();
  if(mode()==='typing')inp.focus();
}
function reveal(w,good,chosen){
  phase='result';if(!failed){answered++;if(!good)missed.push(w)}const mc=mode()==='mc';$('in').disabled=mc;if(!mc){$('in').value='';$('hint').hidden=true}
  const f=$('fb');
  if(good){f.className='fb ok';f.innerHTML=(failed?'Correct, but this card stays in review.':'Correct!')+'<b>'+ansText(w)+'</b>'}
  else{f.className='fb no';f.innerHTML='The answer is<b>'+ansText(w)+'</b>'}
  if(mode()==='mc')[...$('opts').children].forEach(b=>{
    b.disabled=true;
    if(opts.good.includes(b.textContent))b.classList.add('ok');
    else if(b.textContent===chosen)b.classList.add('no');
  });
  $('go').textContent=i+1<q.length?'Next':'See results';
  $('sc').textContent='Correct: '+score;
  layout();(mc?$('go'):$('in')).focus();
}
function pick(s){
  if(phase!=='ask')return;
  const ok=opts.good.includes(s);if(ok)score++;
  reveal(q[i],ok,s);
}
function check(){
  const w=q[i],v=$('in').value;
  if(!v.trim())return;
  const acc=w[1];
  const ok=acc.some(a=>prep(a)===prep(v));
  if(ok){if(!failed)score++;return reveal(w,true)}
  const near=acc.some(a=>noAcc(prep(a))===noAcc(prep(v)));
  const art=useArt()&&acc.some(a=>noArt(base(a))===base(v));
  if((near||art)&&tries===0){
    tries++;const f=$('fb');f.className='fb mid';
    f.textContent=art?'Close. Add the article and check the gender.':'Almost. Check your accents and spelling.';
    return;
  }
  att++;
  if(!failed){failed=true;missed.push(w);answered++}
  if(att>=3)return reveal(w,false);
  const f=$('fb');f.className='fb no';f.textContent='Not quite. '+(3-att)+(att===2?' more try.':' more tries.');$('in').select();
}
function next(){i++;if(i>=q.length)finish(false);else show()}
function finish(early){
  if(!review&&!first)first={s:score,t:early?answered:q.length};
  if(!early&&missed.length){review=true;rounds++;return start(missed.slice(),true)}
  $('quiz').hidden=true;$('end').hidden=false;$('rev').hidden=true;
  $('fill').style.width='100%';
  let t,h='';
  if(early){t=score+' of '+answered+' correct';h='<p>Ended early'+(review?' during review round '+rounds:'')+', '+(q.length-answered)+' cards left.</p>'}
  else t=review?'Review complete':score+' of '+q.length+' correct';
  if(review)h+='<p>First pass: '+first.s+' of '+first.t+' correct.'+(early?'':' Cleared in '+rounds+(rounds===1?' review round.':' review rounds.'))+'</p>';
  else if(!missed.length)h+='<p>No misses. Nice work.</p>';
  if(missed.length)h+='<p>To review:</p><ul>'+missed.map(w=>'<li>'+prompt_(w)+' = <b>'+ansText(w)+'</b></li>').join('')+'</ul>';
  $('endt').textContent=t;$('endm').innerHTML=h;
  $('redo').hidden=!missed.length;
}
$('go').onclick=()=>phase==='ask'?check():next();
function practice(){
  const w=q[i],v=$('in').value;
  if(!v.trim())return;
  const ok=w[1].some(a=>prep(a)===prep(v)),f=$('fb');
  f.className=ok?'fb ok':'fb no';
  f.innerHTML=(ok?'Correct!':'Not quite. The answer is')+'<b>'+ansText(w)+'</b>';
  $('in').value='';$('in').focus();
}
$('pb').onclick=practice;
$('in').addEventListener('input',()=>{if(phase==='result')$('fb').className='fb'});
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();phase==='ask'?check():practice()}});
$('hb').onclick=()=>{
  const w=q[i];if(!failed){failed=true;missed.push(w);answered++}let a=useArt()?w[1][0]:noArt(w[1][0]);hn++;
  $('hint').textContent=a.split('').map((c,k)=>/[\s\-']/.test(c)||k<hn?c:'_').join('');
  $('hint').hidden=false;$('in').focus();
};
$('sb').onclick=()=>reveal(q[i],false);
$('again').onclick=()=>start(deck());
$('redo').onclick=()=>{review=true;rounds++;start(missed.slice(),true)};
$('restart').onclick=()=>start(deck());
$('endb').onclick=()=>{if(q.length&&$('end').hidden)finish(true)};
$('art').onchange=()=>{if(mode()==='mc'&&phase==='ask')show()};

/* ---------- menu ---------- */
function sync(){
  document.querySelectorAll('.seg button').forEach(b=>{
    const k=b.dataset.k,v=b.dataset.v;
    b.setAttribute('aria-checked',String(k==='mode'?mode()===v:S[k]===v));
    if(k==='mode'&&v==='typing')b.disabled=S.lang==='en';
  });
  $('lock').hidden=S.lang!=='en';
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  if(b.disabled||S[b.dataset.k]===b.dataset.v)return;
  S[b.dataset.k]=b.dataset.v;sync();start(deck());
});
$('mb').onclick=()=>{
  const d=$('dock'),o=d.classList.toggle('open');hideTranslations();
  document.body.classList.toggle('menu-open',o);
  $('mb').setAttribute('aria-expanded',o);$('mb').setAttribute('aria-label',o?'Close menu':'Open menu');
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('dock').classList.contains('open'))$('mb').click()});
// Folder headers only expand/collapse; checkboxes select the practice deck.
CONTENT.folders.forEach(folder=>{
  const details=document.createElement('details'),summary=document.createElement('summary'),items=document.createElement('div');
  details.className='set-folder';details.open=true;items.className='folder-items';
  const members=CONTENT.sets.map((s,k)=>({s,k})).filter(({s})=>s.folder===folder.id);
  const label=document.createElement('span'),count=document.createElement('small');
  label.textContent=folder.name;count.textContent=members.length+' '+(members.length===1?'set':'sets');summary.append(label,count);details.append(summary,items);
  members.forEach(({s,k})=>{
    const l=document.createElement('label'),c=document.createElement('input'),name=document.createElement('span'),size=document.createElement('small');
    c.type='checkbox';c.checked=on[k];name.textContent=s.name;size.textContent=s.words.length;
    c.onchange=()=>{on[k]=c.checked;renderVocab();start(deck())};l.append(c,name,size);items.append(l);
  });
  $('sets').append(details);
});
renderVocab();

'éèêàâîïôùûçœë'.split('').forEach(ch=>{
  const b=document.createElement('button');b.type='button';b.textContent=ch;b.setAttribute('aria-label','Insert '+ch);
  b.addEventListener('pointerdown',e=>e.preventDefault());
  b.onclick=()=>{const el=$('in');if(el.disabled)return;el.setRangeText(ch,el.selectionStart,el.selectionEnd,'end');el.dispatchEvent(new Event('input'));el.focus()};
  $('accs').appendChild(b);
});
sync();start(deck());
</script>
